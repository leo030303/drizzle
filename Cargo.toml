[package]
name = "drizzle"
version = "0.1.0"
authors = ["Leo Ring <leoring03@gmail.com>"]
edition = "2024"
publish = false
# rust-version = "1.92"

[profile.release]
lto = true

[dependencies]
chrono = "0.4.45"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_49"] }
relm4-icons = "0.11.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
relm4-icons-build = "0.11"
