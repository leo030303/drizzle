[package]
name = "aimsir"
version = "0.1.0"
authors = ["Leo Ring <leoring03@gmail.com>"]
edition = "2024"
publish = false
# rust-version = "1.92"

[profile.release]
lto = true

[dependencies]
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_49"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
